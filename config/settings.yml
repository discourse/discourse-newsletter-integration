plugins:
  discourse_newsletter_integration_enabled:
    default: false
    client: true
  discourse_newsletter_integration_provider:
    type: enum
    default: mailchimp
    choices:
      - mailchimp
      - listmonk
  discourse_newsletter_integration_mailchimp_api_key:
    default: ""
    secret: true
  discourse_newsletter_integration_mailchimp_list_id: ""
  discourse_newsletter_integration_mailchimp_server_prefix:
    default: ""
    regex: "\\A[a-z0-9]*\\Z"
  discourse_newsletter_integration_mailchimp_webhook_secret:
    default: ""
    secret: true
    hidden: true

  discourse_newsletter_integration_listmonk_url:
    default: ""
    validator: "NewsletterIntegrationListmonkUrlValidator"
  discourse_newsletter_integration_listmonk_api_username:
    default: ""
    min: 3
    regex: '\A[a-zA-Z0-9_.@-]+\z'
  discourse_newsletter_integration_listmonk_api_token:
    default: ""
    secret: true
    regex: '\A[a-zA-Z0-9]{48}\z'
  discourse_newsletter_integration_listmonk_list_id:
    default: 0
    min: 0
  discourse_newsletter_integration_listmonk_preconfirm_subscriptions:
    default: true
